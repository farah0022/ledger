<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Suppress Vite HMR WebSocket error in AI Studio cloud preview environment
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : (protocols || '');
            var urlStr = String(url || '');
            var isViteHmr = protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1 ||
              (urlStr.indexOf('token=') !== -1 && (urlStr.indexOf('/@vite/client') !== -1 || urlStr.indexOf('vite') !== -1));
            if (isViteHmr) {
              var target = new EventTarget();
              var dummy = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                url: urlStr,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr'),
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                var evt = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(evt);
                dummy.dispatchEvent(evt);
              }, 0);
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('@vite/client') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && e.reason.message && (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('@vite/client') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <title>Records Money Time</title>
    <meta name="description" content="A quiet, precise business utility for keeping track of records, understanding money, and scheduling time." />
    <meta name="theme-color" content="#146C43" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <meta property="og:description" content="A quiet, precise business utility for keeping track of records, understanding money, and scheduling time." />

  </head>
